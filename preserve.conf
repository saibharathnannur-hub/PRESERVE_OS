# =====================================================================
# preserve.conf -- every tunable of the PRESERVE governor.
# The code contains no magic numbers: change behaviour here.
#
# Conventions
#   * Units are in the key name: _s seconds, _mib / _mb MiB, _pct percent,
#     _frac fraction 0..1.
#   * cgroup sizes accept K/M/G suffixes or the literal "max" (no limit).
#   * Relative paths are relative to this file's directory.
#   * {uid} expands to the invoking user's uid (SUDO_UID under sudo).
#   * Named scenarios at the end of this file override individual keys
#     ("<section>.<key> = value"); select one with --scenario <name>.
# =====================================================================

[paths]
log_file      = evidence/governor.log     # timestamped log (also echoed to stdout)
telemetry_csv = evidence/telemetry.csv    # one row per sample, for plots
arena_dir     = arena                     # CRIU images: native ext4 only, never /mnt/c or tmpfs
run_dir       = run                       # workload state / progress files
throughput_state = run/throughput.json    # persisted dump-throughput EWMA; --reset-throughput deletes it
lock_file     = run/governor.lock         # flock: one governor at a time; holds a description of its holder

[logging]
level = INFO                              # DEBUG also prints every CRIU command line

[cgroup]
# Leaf cgroup is created inside systemd's per-user delegated subtree.
# The parent is never modified; it must already delegate "memory".
parent          = /sys/fs/cgroup/user.slice/user-{uid}.slice/user@{uid}.service
name            = preserve-test           # PREFIX: each run creates <name>-<pid>-<timestamp>, never shared
memory_max      = 512M                    # hard limit -> cgroup-local OOM killer above it
memory_swap_max = 256M                    # swap the group may use; 0 = none
baseline_memory_swap_max = 0              # --baseline only: no swap, so the cgroup OOM killer must act
memory_high     = max                     # throttle point; "max" = disabled
remove_on_exit  = yes                     # rmdir the cgroup at shutdown (only if empty)

[psi]
source                = cgroup            # cgroup = <cg>/memory.pressure, system = /proc/pressure/memory
metric                = some              # some = latency added, full = throughput lost
window                = avg10             # avg10 | avg60 | avg300
advisory_pct          = 10.0              # >= : log and score, no action
action_pct            = 25.0              # >= : checkpoint the best candidate
recovery_pct          = 5.0               # <= : counts toward recovery (must be < advisory_pct)
recovery_hold_samples = 5                 # consecutive calm samples before a restore (hysteresis)

[sensor]
sample_interval_s   = 0.5                 # control-loop period
log_every_n_samples = 4                   # periodic telemetry line in the log

[governor]
usage_advisory_frac     = 0.75            # memory.current / memory.max thresholds,
usage_action_frac       = 0.90            # combined with PSI (either one triggers)
usage_recovery_frac     = 0.60
capture_cooldown_s      = 5.0             # minimum gap between two checkpoints
decision_log_interval_s = 2.0             # rate limit for scoring/admission log lines
restore_max_attempts    = 3               # per checkpointed process
terminate_grace_s       = 3.0             # SIGTERM -> wait -> SIGKILL at shutdown
demo_duration_s         = 180             # hard stop for the demo
demo_post_restore_s     = 20              # keep observing the restored job this long
dry_run                 = no              # yes = never invoke CRIU (same as --dry-run)

[overhead]
# --measure-overhead: what the governor costs while doing nothing (the normal case).
duration_s = 120                          # measurement window per run
repeat     = 3                            # runs per arm in the A/B throughput comparison

[baseline]
# Control experiment (--baseline): governor observes only, kernel OOM killer acts.
post_oom_observe_s = 15                   # keep observing this long after the first OOM kill
reference_live_run = evidence/GOLD-live-run   # saved live run for the side-by-side summary (read-only); empty = none

[costmodel]
# score = weight_restart*R + weight_memory*RSS_MiB - weight_capture*C
weight_restart           = 1.0            # per second of work that would be lost
weight_memory            = 0.02           # per MiB freed by eviction
weight_capture           = 2.0            # per second the dump is estimated to take
min_restart_cost_s       = 5.0            # R below this: not worth preserving
benefit_ratio            = 2.0            # require R >= benefit_ratio * C
initial_dump_mib_per_s   = 200.0          # starting guess, refined by EWMA after each dump
dump_fixed_overhead_s    = 0.5            # freeze + parasite + metadata, independent of size
ewma_alpha               = 0.3            # weight of the newest throughput observation
image_size_factor        = 1.05           # image bytes per resident byte
image_fixed_overhead_mib = 2.0            # metadata images (fds, mm, core, ...)

[admission]
arena_size_mib          = 2048            # byte budget for all image sets
fs_reserve_mib          = 1024            # always leave this much free on the arena's filesystem
max_inflight_captures   = 1               # concurrent dumps
max_capture_s           = 10.0            # refuse dumps estimated to take longer
restore_headroom_margin = 0.25            # restore needs RSS * (1 + margin) of free cgroup room

[capture]
criu_bin                  = criu          # looked up in PATH, then /usr/sbin
shell_job                 = yes           # --shell-job (workloads are setsid session leaders)
log_level                 = 4             # criu -v<N>; 4 = full debug, as in the feasibility test
dump_timeout_s            = 60
restore_timeout_s         = 60
keep_images_after_restore = no            # yes = keep image sets as evidence (they count against the arena)
log_tail_lines            = 40            # lines of dump.log / restore.log shown on failure
dump_extra_args           =               # --leave-running / --leave-stopped are rejected
restore_extra_args        =

[workloads]
python_bin           =                    # empty = the interpreter running the governor
run_as_invoking_user = yes                # workloads drop root and run as the sudo caller
workload             = compute            # valuable workload: compute (one process) | pipeline (dependent group)

# pipeline_job (Objective 6): parent + forked child joined by a pipe; hash-chain
# parameters are shared with compute_job (compute_hashes_per_iteration, ...).
pipeline_parent_mb   = 40                 # parent's resident working set
pipeline_child_mb    = 260                # child's resident working set

# compute_job: the process worth preserving
compute_working_set_mb         = 128      # resident, dirtied memory (the eviction payoff)
compute_hashes_per_iteration   = 50000    # CPU work per iteration (SHA-256 rounds)
compute_step_sleep_s           = 0.05     # pause between iterations
compute_report_every           = 10       # iterations between state/progress writes
compute_touch_every            = 10       # iterations between re-dirtying the working set
compute_max_iteration_credit_s = 1.0      # an iteration longer than this spanned a checkpoint

# hog: the antagonist that creates pressure
hog_start_delay_s      = 20               # let compute_job accumulate work first
hog_chunk_mb           = 16               # allocation step
hog_interval_s         = 0.5              # time between steps
hog_target_mb          = 400              # 400 + 128 > 512 -> pressure unless something is evicted
hog_hold_s             = 25               # hold at target, then exit so pressure can recover
hog_retouch_interval_s = 2.0              # re-dirty all pages while holding (keeps PSI up)

# =====================================================================
# Named scenarios. Each overrides only the keys listed; everything else
# is the base configuration above, identical across scenarios.
# Select with:  ./run_demo.sh --scenario B [--baseline]
# =====================================================================
[scenarios]
default = A

[scenario.A]
description = Kernel already right - the hog is the largest process, so footprint-based OOM selection kills it and compute_job (128 MiB) is never at risk; PRESERVE offers no benefit
# (no overrides: the base values above are scenario A)

[scenario.B]
description = Large long-running job vs smaller burst - compute_job is the largest process, so the kernel's footprint-based OOM selection kills the valuable job
workloads.compute_working_set_mb = 300    # compute_job charged ~309 MiB (measured overhead ~8.7 MiB)
# hog 240: 309 + 240 + ~7 overhead = ~556 MiB > 512M (180 would give ~496 MiB: no OOM at all).
# At the OOM moment compute_job ~309 MiB > hog ~200 MiB, so the kernel picks compute_job.
workloads.hog_target_mb          = 240
workloads.hog_start_delay_s      = 40     # compute_job reaches R ~12 s (~2.4x min_restart_cost_s) before pressure
cgroup.memory_swap_max           = 0      # same cgroup as the baseline: PRESERVE must beat the OOM killer without swap
baseline.reference_live_run      =        # no saved live run yet; compare with src/compare.py afterwards

[scenario.C]
description = Dependent group - pipeline_job parent (40 MiB) + child (260 MiB) joined by a pipe, vs the same hog as B; the kernel OOM-kills the child (largest process) and the parent loses its work through the pipe
workloads.workload               = pipeline
# child ~269 + parent ~49 (incl. ~9 MiB interpreter each) = ~318 MiB; hog 240 -> ~558 MiB > 512M.
# At the OOM moment the hog holds <= ~194 MiB < child ~269 MiB, so the kernel picks the child.
workloads.hog_target_mb          = 240
workloads.hog_start_delay_s      = 40     # group R (sum of both members) well above min_restart_cost_s
cgroup.memory_swap_max           = 0      # as B: PRESERVE must beat the OOM killer without swap
baseline.reference_live_run      =
